<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <!-- Location pin with motion lines -->
  <g transform="translate(100, 50)">
    <!-- Motion lines -->
    <rect x="-50" y="30" width="35" height="8" rx="4" fill="#1d3557" />
    <rect x="-60" y="50" width="45" height="8" rx="4" fill="#1d3557" />
    <rect x="-55" y="70" width="40" height="8" rx="4" fill="#1d3557" />
    <rect x="-45" y="90" width="30" height="8" rx="4" fill="#1d3557" />
    
    <!-- Pin base -->
    <path d="M50,50 C50,22.4 27.6,0 0,0 C-27.6,0 -50,22.4 -50,50 C-50,88.7 0,140 0,140 C0,140 50,88.7 50,50 Z" fill="#1d3557" />
    
    <!-- Pin inner circle -->
    <circle cx="0" cy="50" r="20" fill="white" />
    
    <!-- Curvy path at bottom -->
    <path d="M0,140 C10,125 25,115 40,110" stroke="#1d3557" fill="transparent" stroke-width="8" stroke-linecap="round" />
  </g>
  
  <!-- Text -->
  <text x="150" y="220" font-family="Arial, sans-serif" font-weight="bold" font-size="32" fill="#1d3557" text-anchor="middle">Ride<tspan fill="#4a4a4a">Share</tspan></text>
  <text x="150" y="240" font-family="Arial, sans-serif" font-size="12" fill="#4a4a4a" text-anchor="middle">YOUR ENGINE</text>
</svg>
